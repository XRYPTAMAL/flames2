<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLAMES 2.0 — Relationship Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --pink: #ff2d78;
    --blue: #00d4ff;
    --purple: #8b00ff;
    --dark: #050008;
    --card: rgba(255,255,255,0.04);
    --glow-pink: 0 0 20px rgba(255,45,120,0.6), 0 0 60px rgba(255,45,120,0.2);
    --glow-blue: 0 0 20px rgba(0,212,255,0.6), 0 0 60px rgba(0,212,255,0.2);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(139,0,255,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,45,120,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(0,212,255,0.10) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.8s ease;
  }
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-30px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, var(--pink), var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    position: relative;
    display: inline-block;
  }
  .logo::after {
    content: 'FLAMES 2.0';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: blur(8px);
    opacity: 0.5;
    z-index: -1;
  }

  .tagline {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Suggestion text */
  .suggestion {
    color: var(--pink);
    font-size: 0.95rem;
    margin-top: 8px;
    letter-spacing: 1px;
    min-height: 24px;
    transition: opacity 0.3s;
    text-shadow: 0 0 10px rgba(255,45,120,0.5);
  }

  /* Main card */
  .card {
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: fadeUp 0.8s ease 0.2s both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(40px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* Input group */
  .input-group {
    margin-bottom: 20px;
    position: relative;
  }

  .input-label {
    display: block;
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input-field {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px 20px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 2px;
    outline: none;
    transition: all 0.3s;
  }
  .input-field:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,45,120,0.15), var(--glow-pink);
    background: rgba(255,45,120,0.05);
  }
  .input-field::placeholder { color: rgba(255,255,255,0.2); }

  .heart-divider {
    text-align: center;
    font-size: 1.5rem;
    margin: 4px 0;
    animation: heartbeat 1.5s ease infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* Check button */
  .btn-check {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    margin-top: 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(255,45,120,0.3);
  }
  .btn-check::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--blue), var(--pink));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn-check:hover::before { opacity: 1; }
  .btn-check:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,45,120,0.5); }
  .btn-check:active { transform: translateY(0); }
  .btn-check span { position: relative; z-index: 1; }
  .btn-check:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* FLAMES letters display */
  .flames-display {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 28px 0 8px;
    flex-wrap: wrap;
  }

  .flame-letter {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: white;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .flame-letter.active {
    border-color: var(--pink);
    color: var(--pink);
    box-shadow: var(--glow-pink);
    background: rgba(255,45,120,0.1);
    transform: scale(1.15);
  }
  .flame-letter.eliminated {
    opacity: 0.15;
    transform: scale(0.85);
    text-decoration: line-through;
    border-color: rgba(255,255,255,0.05);
  }
  .flame-letter.winner {
    border-color: var(--blue);
    color: var(--blue);
    box-shadow: var(--glow-blue);
    background: rgba(0,212,255,0.1);
    animation: winnerPulse 0.6s ease infinite alternate;
    transform: scale(1.3);
  }
  @keyframes winnerPulse {
    from { box-shadow: var(--glow-blue); }
    to   { box-shadow: 0 0 40px rgba(0,212,255,0.9), 0 0 80px rgba(0,212,255,0.4); }
  }

  /* Counter */
  .counter-display {
    text-align: center;
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: var(--pink);
    text-shadow: var(--glow-pink);
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .counter-display.counting { animation: countBounce 0.15s ease; }
  @keyframes countBounce {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* Loading */
  .loading-bar {
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin: 16px 0;
    display: none;
  }
  .loading-bar.active { display: block; }
  .loading-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--blue), var(--purple));
    border-radius: 2px;
    animation: loadFill 1.5s ease forwards;
  }
  @keyframes loadFill {
    from { width: 0%; }
    to   { width: 100%; }
  }

  /* Result */
  .result-container {
    display: none;
    text-align: center;
    animation: resultReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .result-container.show { display: block; }
  @keyframes resultReveal {
    0%   { opacity:0; transform: scale(0.3) rotate(-10deg); }
    60%  { transform: scale(1.1) rotate(2deg); }
    100% { opacity:1; transform: scale(1) rotate(0deg); }
  }

  .result-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 8px;
    animation: emojiFloat 2s ease infinite;
  }
  @keyframes emojiFloat {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  .result-word {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  .result-word.FRIEND   { color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,0.6); }
  .result-word.LOVER    { color: var(--pink); text-shadow: var(--glow-pink); }
  .result-word.AFFECTION{ color: #ffaa00; text-shadow: 0 0 30px rgba(255,170,0,0.6); }
  .result-word.MARRIAGE { color: var(--blue); text-shadow: var(--glow-blue); }
  .result-word.ENEMY    { color: #ff4444; text-shadow: 0 0 30px rgba(255,68,68,0.6); }

  .result-message {
    color: rgba(255,255,255,0.7);
    font-size: 1.1rem;
    letter-spacing: 1px;
    margin-bottom: 24px;
    font-style: italic;
  }

  /* Try again */
  .btn-again {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: rgba(255,255,255,0.7);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 12px 32px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .btn-again:hover {
    border-color: var(--pink);
    color: var(--pink);
    box-shadow: var(--glow-pink);
    transform: translateY(-2px);
  }

  /* Share button */
  .btn-share {
    background: transparent;
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 10px;
    color: var(--blue);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 10px 24px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    margin-left: 12px;
  }
  .btn-share:hover { box-shadow: var(--glow-blue); transform: translateY(-2px); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
    flex-wrap: wrap;
    animation: fadeUp 0.8s ease 0.5s both;
  }
  .stat-item {
    text-align: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 20px;
    min-width: 80px;
  }
  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--pink);
  }
  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Letter cancel animation */
  .names-display {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin: 12px 0;
    min-height: 36px;
  }
  .name-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 32px;
    border-radius: 6px;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s;
    text-transform: uppercase;
  }
  .name-letter.cancelled {
    background: rgba(255,45,120,0.1);
    color: var(--pink);
    border-color: var(--pink);
    text-decoration: line-through;
    opacity: 0.4;
    transform: scale(0.85);
  }
  .name-sep {
    display: flex;
    align-items: center;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
    padding: 0 4px;
  }

  /* Copied toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,212,255,0.15);
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 0.9rem;
    letter-spacing: 2px;
    backdrop-filter: blur(10px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .flame-letter { width: 40px; height: 40px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Toast -->
<div class="toast" id="toast">✓ COPIED TO CLIPBOARD</div>

<div class="container">
  <div class="header">
    <div class="logo">FLAMES</div>
    <div style="font-family:'Orbitron',monospace; color:rgba(255,255,255,0.3); font-size:0.7rem; letter-spacing:6px; margin-top:4px;">2.0 — RELATIONSHIP ORACLE</div>
    <div class="suggestion" id="suggestion">Try with your crush 👀</div>
  </div>

  <div class="card">
    <!-- Input phase -->
    <div id="inputPhase">
      <div class="input-group">
        <label class="input-label">✦ Your Name</label>
        <input class="input-field" id="name1" placeholder="Enter your name..." maxlength="30" autocomplete="off"/>
      </div>

      <div class="heart-divider">💗</div>

      <div class="input-group">
        <label class="input-label">✦ Their Name</label>
        <input class="input-field" id="name2" placeholder="Enter their name..." maxlength="30" autocomplete="off"/>
      </div>

      <button class="btn-check" id="btnCheck" onclick="startFlames()">
        <span>⚡ REVEAL DESTINY</span>
      </button>
    </div>

    <!-- Animation phase -->
    <div id="animPhase" style="display:none;">
      <div style="text-align:center; color:rgba(255,255,255,0.4); font-size:0.75rem; letter-spacing:3px; text-transform:uppercase; margin-bottom:12px;">Calculating fate...</div>

      <!-- Letter cancel display -->
      <div class="names-display" id="namesDisplay"></div>

      <div class="loading-bar active" style="margin: 20px 0;">
        <div class="loading-fill"></div>
      </div>

      <!-- FLAMES letters -->
      <div class="flames-display" id="flamesDisplay">
        <div class="flame-letter" id="fl-F">F</div>
        <div class="flame-letter" id="fl-L">L</div>
        <div class="flame-letter" id="fl-A">A</div>
        <div class="flame-letter" id="fl-M">M</div>
        <div class="flame-letter" id="fl-E">E</div>
        <div class="flame-letter" id="fl-S">S</div>
      </div>

      <!-- Counter -->
      <div class="counter-display" id="counterDisplay">—</div>
    </div>

    <!-- Result phase -->
    <div id="resultPhase" class="result-container">
      <span class="result-emoji" id="resultEmoji">💫</span>
      <div class="result-word" id="resultWord">LOVER</div>
      <div class="result-message" id="resultMessage">Bro… this is dangerous 😏</div>
      <div>
        <button class="btn-again" onclick="resetGame()">↺ Try Again</button>
        <button class="btn-share" onclick="shareResult()">⬆ Share</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total Plays</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statToday">0</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statTop">—</div>
      <div class="stat-label">Top Result</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════
const colors = ['#ff2d78','#00d4ff','#8b00ff','#ff88cc','#44ffdd']
const pc = document.getElementById('particles')
for(let i=0; i<35; i++) {
  const p = document.createElement('div')
  p.className = 'particle'
  p.style.cssText = `
    left: ${Math.random()*100}%;
    background: ${colors[Math.floor(Math.random()*colors.length)]};
    width: ${Math.random()*3+1}px;
    height: ${Math.random()*3+1}px;
    animation-duration: ${Math.random()*15+8}s;
    animation-delay: ${Math.random()*10}s;
    opacity: ${Math.random()*0.6+0.2};
  `
  pc.appendChild(p)
}

// ═══════════════════════════════════════
// SUGGESTIONS
// ═══════════════════════════════════════
const suggestions = [
  "Try with your crush 👀",
  "Best friend or something more? 🤔",
  "The stars don't lie... ✨",
  "Dare to know the truth? 💀",
  "Your fate is already written 🔮",
  "Warning: results may cause feelings 😳",
  "Who are you thinking about right now? 👁️"
]
let si = 0
setInterval(() => {
  si = (si+1) % suggestions.length
  const el = document.getElementById('suggestion')
  el.style.opacity = 0
  setTimeout(() => { el.textContent = suggestions[si]; el.style.opacity = 1; }, 300)
}, 4000)

// ═══════════════════════════════════════
// STATS (localStorage)
// ═══════════════════════════════════════
function getStats() {
  return JSON.parse(localStorage.getItem('flames_stats') || '{"total":0,"today":0,"todayDate":"","results":{}}')
}
function saveStats(s) { localStorage.setItem('flames_stats', JSON.stringify(s)) }
function updateStats(result) {
  const s = getStats()
  const today = new Date().toDateString()
  s.total++
  if(s.todayDate !== today) { s.today = 0; s.todayDate = today }
  s.today++
  s.results[result] = (s.results[result]||0)+1
  saveStats(s)
  renderStats(s)
}
function renderStats(s) {
  s = s || getStats()
  document.getElementById('statTotal').textContent = s.total
  document.getElementById('statToday').textContent = s.today
  // Top result
  let top = '—', topVal = 0
  for(const [k,v] of Object.entries(s.results||{})) { if(v>topVal){topVal=v;top=k[0]} }
  document.getElementById('statTop').textContent = top
}
renderStats()

// ═══════════════════════════════════════
// FLAMES ALGORITHM
// ═══════════════════════════════════════
function flamesAlgo(n1, n2) {
  let a = n1.toLowerCase().replace(/\s/g,'').split('')
  let b = n2.toLowerCase().replace(/\s/g,'').split('')

  // Remove common letters
  for(let i=0; i<a.length; i++) {
    const j = b.indexOf(a[i])
    if(j !== -1) { a[i]=null; b[j]=null }
  }
  const count = a.filter(x=>x).length + b.filter(x=>x).length

  // Cycle through FLAMES
  const flames = ['F','L','A','M','E','S']
  let idx = 0
  while(flames.length > 1) {
    idx = (idx + count - 1) % flames.length
    flames.splice(idx, 1)
    if(idx >= flames.length) idx = 0
  }
  return { result: flames[0], count }
}

// ═══════════════════════════════════════
// RESULT DATA
// ═══════════════════════════════════════
const resultData = {
  F: { word:'FRIEND',    emoji:'🤝', msg:"Best friends forever! But are you sure? 👀",          cls:'FRIEND'   },
  L: { word:'LOVER',     emoji:'💘', msg:"Bro… this is dangerous 😏",                           cls:'LOVER'    },
  A: { word:'AFFECTION', emoji:'🥺', msg:"There's something there... don't ignore it 💛",       cls:'AFFECTION'},
  M: { word:'MARRIAGE',  emoji:'💍', msg:"Someone's getting a ring soon 👀🔥",                  cls:'MARRIAGE' },
  E: { word:'ENEMY',     emoji:'💀', msg:"Avoid eye contact. Run. 💀",                          cls:'ENEMY'    },
  S: { word:'SOULMATES', emoji:'✨', msg:"Written in the stars. This is fate 🌌",               cls:'LOVER'    },
}

// ═══════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════
let currentResult = null
let n1Val = '', n2Val = ''

// ═══════════════════════════════════════
// START FLAMES
// ═══════════════════════════════════════
function startFlames() {
  n1Val = document.getElementById('name1').value.trim()
  n2Val = document.getElementById('name2').value.trim()

  if(!n1Val || !n2Val) {
    // Shake the empty fields
    const fields = document.querySelectorAll('.input-field')
    fields.forEach(f => {
      if(!f.value.trim()) {
        f.style.borderColor = '#ff2d78'
        f.style.animation = 'shake 0.4s ease'
        setTimeout(()=>{ f.style.animation=''; f.style.borderColor=''; }, 500)
      }
    })
    return
  }

  const { result, count } = flamesAlgo(n1Val, n2Val)
  currentResult = result

  // Switch to anim phase
  document.getElementById('inputPhase').style.display = 'none'
  document.getElementById('animPhase').style.display = 'block'
  document.getElementById('resultPhase').classList.remove('show')

  // Reset FLAMES letters
  'FLAMES'.split('').forEach(l => {
    const el = document.getElementById('fl-'+l)
    el.className = 'flame-letter'
  })

  // Show letter cancellation
  showLetterAnim(n1Val, n2Val, count, result)
}

function showLetterAnim(n1, n2, count, result) {
  // Build names display
  const nd = document.getElementById('namesDisplay')
  nd.innerHTML = ''

  let a = n1.toLowerCase().replace(/\s/g,'').split('')
  let b = n2.toLowerCase().replace(/\s/g,'').split('')
  const cancelled1 = []
  const cancelled2 = []

  // Find cancelled pairs
  const ta = [...a], tb = [...b]
  for(let i=0; i<ta.length; i++) {
    const j = tb.indexOf(ta[i])
    if(j !== -1) { cancelled1.push(i); tb[j]=null; ta[i]=null }
  }
  let ci=0
  for(let i=0; i<a.length; i++) {
    if(ta[i]===null) cancelled2.push(ci)
    ci++
  }

  // Render name 1
  a.forEach((l,i) => {
    const span = document.createElement('span')
    span.className = 'name-letter'
    span.textContent = l
    span.id = 'nl1-'+i
    nd.appendChild(span)
  })

  // Separator
  const sep = document.createElement('span')
  sep.className = 'name-sep'
  sep.textContent = '+'
  nd.appendChild(sep)

  // Render name 2
  b.forEach((l,i) => {
    const span = document.createElement('span')
    span.className = 'name-letter'
    span.textContent = l
    span.id = 'nl2-'+i
    nd.appendChild(span)
  })

  // Animate cancellations
  let delay = 200
  cancelled1.forEach((i, idx) => {
    setTimeout(() => {
      document.getElementById('nl1-'+i)?.classList.add('cancelled')
      // Find matching in b
      const bIdx = [...b].findIndex((l,bi) => l===a[i] && !document.getElementById('nl2-'+bi)?.classList.contains('cancelled'))
      if(bIdx !== -1) document.getElementById('nl2-'+bIdx)?.classList.add('cancelled')
    }, delay + idx*150)
    delay += 150
  })

  // After cancellations, show counter & FLAMES cycling
  const totalDelay = delay + 500
  setTimeout(() => startFlamesCycling(count, result), totalDelay)
}

function startFlamesCycling(count, result) {
  const flames = ['F','L','A','M','E','S']
  let active = [...flames]
  let idx = 0
  const counterEl = document.getElementById('counterDisplay')

  // Show counting animation
  let step = 0
  const totalSteps = active.length > 1 ? 20 : 0

  function cycle() {
    if(active.length <= 1) {
      // Done!
      const winner = active[0]
      const el = document.getElementById('fl-'+winner)
      el.className = 'flame-letter winner'
      counterEl.textContent = '★'

      setTimeout(() => showResult(winner), 800)
      return
    }

    // Count through
    for(let c=0; c<count; c++) {
      idx = (idx) % active.length
      // Highlight current
      flames.forEach(l => {
        const el = document.getElementById('fl-'+l)
        if(el && !el.classList.contains('eliminated')) {
          el.classList.remove('active')
        }
      })
      if(c === count-1) {
        const el = document.getElementById('fl-'+active[idx])
        if(el) el.classList.add('active')
      }
      idx++
    }
    idx--

    // Eliminate
    const eliminated = active[idx % active.length]
    const elimEl = document.getElementById('fl-'+eliminated)
    if(elimEl) {
      elimEl.classList.remove('active')
      elimEl.classList.add('eliminated')
    }
    active.splice(idx % active.length, 1)
    if(idx >= active.length) idx = 0

    // Update counter with bounce
    counterEl.classList.remove('counting')
    void counterEl.offsetWidth
    counterEl.classList.add('counting')
    counterEl.textContent = active.join(' ')

    const speed = active.length > 3 ? 400 : active.length > 2 ? 500 : 700
    setTimeout(cycle, speed)
  }

  // Start with a brief pause
  counterEl.textContent = count + ' letters'
  setTimeout(cycle, 600)
}

function showResult(letter) {
  const data = resultData[letter] || resultData['F']

  document.getElementById('animPhase').style.display = 'none'
  document.getElementById('resultPhase').classList.add('show')

  document.getElementById('resultEmoji').textContent = data.emoji
  const rw = document.getElementById('resultWord')
  rw.textContent = data.word
  rw.className = 'result-word ' + data.cls
  document.getElementById('resultMessage').textContent = data.msg

  updateStats(data.word)

  // Vibrate if supported
  if(navigator.vibrate) navigator.vibrate([100, 50, 200])
}

function resetGame() {
  document.getElementById('resultPhase').classList.remove('show')
  document.getElementById('animPhase').style.display = 'none'
  document.getElementById('inputPhase').style.display = 'block'
  document.getElementById('name1').value = ''
  document.getElementById('name2').value = ''
  document.getElementById('name1').focus()
}

function shareResult() {
  if(!currentResult) return
  const data = resultData[currentResult]
  const text = `🔥 FLAMES 2.0 says ${n1Val} + ${n2Val} = ${data.word} ${data.emoji}\nFind your fate → ${window.location.href}`
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast')
    t.classList.add('show')
    setTimeout(() => t.classList.remove('show'), 2500)
  })
}

// Enter key support
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('inputPhase').style.display !== 'none') {
    startFlames()
  }
})
