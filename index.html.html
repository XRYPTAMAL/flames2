<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLAMES 2.0 — Relationship Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --pink: #ff2d78;
    --blue: #00d4ff;
    --purple: #8b00ff;
    --dark: #050008;
    --card: rgba(255,255,255,0.04);
    --glow-pink: 0 0 20px rgba(255,45,120,0.6), 0 0 60px rgba(255,45,120,0.2);
    --glow-blue: 0 0 20px rgba(0,212,255,0.6), 0 0 60px rgba(0,212,255,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--dark);
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(139,0,255,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,45,120,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(0,212,255,0.10) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .particles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .particle {
    position:absolute; width:2px; height:2px; border-radius:50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0%{transform:translateY(100vh) scale(0);opacity:0}
    10%{opacity:1} 90%{opacity:1}
    100%{transform:translateY(-10vh) scale(1);opacity:0}
  }

  /* ── PAGES ── */
  .page { display:none; position:relative; z-index:1; min-height:100vh; }
  .page.active { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

  /* ── SHARED CARD ── */
  .card {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeDown {
    from{opacity:0;transform:translateY(-20px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── LOGO ── */
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, var(--pink), var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    display: block;
  }
  .logo-sub {
    font-family: 'Orbitron', monospace;
    color: rgba(255,255,255,0.25);
    font-size: 0.6rem;
    letter-spacing: 5px;
    text-align: center;
    margin-top: 4px;
    display: block;
  }

  /* ── AUTH INPUTS ── */
  .auth-title {
    font-family: 'Orbitron', monospace;
    color: white;
    font-size: 1rem;
    letter-spacing: 3px;
    text-align: center;
    margin: 24px 0 28px;
  }
  .input-label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .input-field {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 18px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    outline: none;
    transition: all 0.3s;
    margin-bottom: 16px;
  }
  .input-field:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,45,120,0.15);
    background: rgba(255,45,120,0.05);
  }
  .input-field::placeholder { color: rgba(255,255,255,0.2); }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(255,45,120,0.3);
    position: relative;
    overflow: hidden;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow: 0 12px 40px rgba(255,45,120,0.5); }
  .btn-primary:active { transform:translateY(0); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  .btn-secondary {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: rgba(255,255,255,0.6);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
  }
  .btn-secondary:hover { border-color:var(--blue); color:var(--blue); }

  .switch-text {
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 0.85rem;
    margin-top: 20px;
  }
  .switch-link {
    color: var(--pink);
    cursor: pointer;
    text-decoration: underline;
    font-weight: 600;
  }
  .switch-link:hover { color: var(--blue); }

  .error-msg {
    background: rgba(255,45,120,0.1);
    border: 1px solid rgba(255,45,120,0.3);
    border-radius: 8px;
    color: var(--pink);
    font-size: 0.85rem;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: none;
    text-align: center;
  }
  .error-msg.show { display: block; animation: fadeUp 0.3s ease; }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .divider span { color: rgba(255,255,255,0.2); font-size: 0.75rem; }

  /* ── USER BAR ── */
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
    animation: fadeDown 0.6s ease;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    color: white;
  }
  .user-email {
    color: rgba(255,255,255,0.5);
    font-size: 0.85rem;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: rgba(255,255,255,0.4);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 2px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-logout:hover { border-color:var(--pink); color:var(--pink); }

  /* ── GAME STYLES ── */
  .header { text-align:center; margin-bottom:28px; animation:fadeDown 0.8s ease; }
  .suggestion {
    color: var(--pink);
    font-size: 0.9rem;
    margin-top: 8px;
    letter-spacing: 1px;
    min-height: 22px;
    transition: opacity 0.3s;
    text-shadow: 0 0 10px rgba(255,45,120,0.5);
  }
  .game-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 36px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    animation: fadeUp 0.6s ease 0.1s both;
  }
  .heart-divider { text-align:center; font-size:1.4rem; margin:4px 0; animation:heartbeat 1.5s ease infinite; }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

  .btn-check {
    width:100%; padding:17px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border:none; border-radius:12px; color:white;
    font-family:'Orbitron',monospace; font-size:0.9rem; font-weight:700;
    letter-spacing:3px; cursor:pointer; margin-top:22px;
    position:relative; overflow:hidden; transition:all 0.3s;
    box-shadow: 0 8px 32px rgba(255,45,120,0.3);
  }
  .btn-check:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(255,45,120,0.5); }
  .btn-check span { position:relative; z-index:1; }

  .flames-display { display:flex; justify-content:center; gap:10px; margin:24px 0 8px; flex-wrap:wrap; }
  .flame-letter {
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-family:'Orbitron',monospace; font-size:1rem; font-weight:700;
    border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04);
    color:white; transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .flame-letter.active { border-color:var(--pink); color:var(--pink); box-shadow:var(--glow-pink); background:rgba(255,45,120,0.1); transform:scale(1.15); }
  .flame-letter.eliminated { opacity:0.12; transform:scale(0.85); text-decoration:line-through; border-color:rgba(255,255,255,0.04); }
  .flame-letter.winner { border-color:var(--blue); color:var(--blue); box-shadow:var(--glow-blue); background:rgba(0,212,255,0.1); animation:winnerPulse 0.6s ease infinite alternate; transform:scale(1.3); }
  @keyframes winnerPulse { from{box-shadow:var(--glow-blue)} to{box-shadow:0 0 40px rgba(0,212,255,0.9),0 0 80px rgba(0,212,255,0.4)} }

  .counter-display {
    text-align:center; font-family:'Orbitron',monospace; font-size:1.8rem; font-weight:900;
    color:var(--pink); text-shadow:var(--glow-pink); min-height:48px;
    display:flex; align-items:center; justify-content:center; transition:all 0.2s;
  }
  .loading-bar { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; margin:14px 0; display:none; }
  .loading-bar.active { display:block; }
  .loading-fill { height:100%; background:linear-gradient(90deg,var(--pink),var(--blue),var(--purple)); border-radius:2px; animation:loadFill 1.5s ease forwards; }
  @keyframes loadFill { from{width:0%} to{width:100%} }

  .result-container { display:none; text-align:center; animation:resultReveal 0.8s cubic-bezier(0.34,1.56,0.64,1); }
  .result-container.show { display:block; }
  @keyframes resultReveal { 0%{opacity:0;transform:scale(0.3) rotate(-10deg)} 60%{transform:scale(1.1) rotate(2deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }

  .result-emoji { font-size:3.5rem; display:block; margin-bottom:8px; animation:emojiFloat 2s ease infinite; }
  @keyframes emojiFloat { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-10px) rotate(5deg)} }

  .result-word { font-family:'Orbitron',monospace; font-size:clamp(1.8rem,7vw,3rem); font-weight:900; letter-spacing:4px; margin-bottom:10px; }
  .result-word.FRIEND    { color:#00ff88; text-shadow:0 0 30px rgba(0,255,136,0.6); }
  .result-word.LOVER     { color:var(--pink); text-shadow:var(--glow-pink); }
  .result-word.AFFECTION { color:#ffaa00; text-shadow:0 0 30px rgba(255,170,0,0.6); }
  .result-word.MARRIAGE  { color:var(--blue); text-shadow:var(--glow-blue); }
  .result-word.ENEMY     { color:#ff4444; text-shadow:0 0 30px rgba(255,68,68,0.6); }
  .result-word.SOULMATES { color:var(--blue); text-shadow:var(--glow-blue); }

  .result-message { color:rgba(255,255,255,0.6); font-size:1rem; letter-spacing:1px; margin-bottom:20px; font-style:italic; }

  .btn-again {
    background:transparent; border:1px solid rgba(255,255,255,0.15); border-radius:10px;
    color:rgba(255,255,255,0.6); font-family:'Rajdhani',sans-serif; font-size:0.95rem;
    font-weight:600; letter-spacing:2px; padding:11px 28px; cursor:pointer; transition:all 0.3s; text-transform:uppercase;
  }
  .btn-again:hover { border-color:var(--pink); color:var(--pink); box-shadow:var(--glow-pink); }

  .btn-share {
    background:transparent; border:1px solid rgba(0,212,255,0.25); border-radius:10px;
    color:var(--blue); font-family:'Rajdhani',sans-serif; font-size:0.9rem;
    font-weight:600; letter-spacing:2px; padding:10px 22px; cursor:pointer; transition:all 0.3s;
    text-transform:uppercase; margin-left:10px;
  }
  .btn-share:hover { box-shadow:var(--glow-blue); }

  .names-display { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:12px 0; min-height:34px; }
  .name-letter {
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:30px; border-radius:6px; font-family:'Orbitron',monospace;
    font-size:0.8rem; font-weight:700; background:rgba(255,255,255,0.07);
    color:white; border:1px solid rgba(255,255,255,0.1); transition:all 0.4s; text-transform:uppercase;
  }
  .name-letter.cancelled { background:rgba(255,45,120,0.1); color:var(--pink); border-color:var(--pink); text-decoration:line-through; opacity:0.4; transform:scale(0.85); }
  .name-sep { display:flex; align-items:center; color:rgba(255,255,255,0.2); font-size:0.8rem; padding:0 4px; }

  .stats-bar { display:flex; justify-content:center; gap:16px; margin-top:24px; flex-wrap:wrap; animation:fadeUp 0.8s ease 0.4s both; }
  .stat-item { text-align:center; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:10px 18px; min-width:75px; }
  .stat-num { font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:700; color:var(--pink); }
  .stat-label { font-size:0.65rem; color:rgba(255,255,255,0.25); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }

  .toast {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(100px);
    background:rgba(0,212,255,0.12); border:1px solid var(--blue); color:var(--blue);
    padding:11px 26px; border-radius:50px; font-size:0.85rem; letter-spacing:2px;
    backdrop-filter:blur(10px); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:100;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  @media(max-width:480px) {
    .card,.game-card { padding:24px 18px; }
    .flame-letter { width:38px; height:38px; font-size:0.9rem; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="toast" id="toast">✓ COPIED!</div>

<!-- ═══════════════════════════════ LOGIN PAGE ═══════════════════════════════ -->
<div class="page active" id="authPage">
  <span class="logo">FLAMES</span>
  <span class="logo-sub">2.0 — RELATIONSHIP ORACLE</span>

  <div class="card" style="margin-top:28px;">
    <div class="error-msg" id="authError">Something went wrong!</div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="auth-title">⚡ SIGN IN</div>
      <label class="input-label">Email</label>
      <input class="input-field" id="loginEmail" type="email" placeholder="your@email.com"/>
      <label class="input-label">Password</label>
      <input class="input-field" id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="btn-primary" onclick="doLogin()" id="btnLogin">SIGN IN →</button>
      <div class="divider"><span>OR</span></div>
      <button class="btn-secondary" onclick="doGuest()">👻 Continue as Guest</button>
      <div class="switch-text">No account? <span class="switch-link" onclick="showRegister()">Register here</span></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
      <div class="auth-title">✦ CREATE ACCOUNT</div>
      <label class="input-label">Email</label>
      <input class="input-field" id="regEmail" type="email" placeholder="your@email.com"/>
      <label class="input-label">Password (min 6 chars)</label>
      <input class="input-field" id="regPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()"/>
      <button class="btn-primary" onclick="doRegister()" id="btnReg">CREATE ACCOUNT →</button>
      <div class="switch-text">Have account? <span class="switch-link" onclick="showLogin()">Sign in</span></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ GAME PAGE ═══════════════════════════════ -->
<div class="page" id="gamePage">
  <!-- User bar -->
  <div class="user-bar">
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-email" id="userEmail">Loading...</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">LOGOUT</button>
  </div>

  <div class="header">
    <span class="logo">FLAMES</span>
    <span class="logo-sub">2.0 — RELATIONSHIP ORACLE</span>
    <div class="suggestion" id="suggestion">Try with your crush 👀</div>
  </div>

  <div class="game-card">
    <!-- Input phase -->
    <div id="inputPhase">
      <div class="input-group">
        <label class="input-label">✦ Your Name</label>
        <input class="input-field" id="name1" placeholder="Enter your name..." maxlength="30" autocomplete="off"/>
      </div>
      <div class="heart-divider">💗</div>
      <div class="input-group" style="margin-top:4px;">
        <label class="input-label">✦ Their Name</label>
        <input class="input-field" id="name2" placeholder="Enter their name..." maxlength="30" autocomplete="off"/>
      </div>
      <button class="btn-check" onclick="startFlames()"><span>⚡ REVEAL DESTINY</span></button>
    </div>

    <!-- Animation phase -->
    <div id="animPhase" style="display:none;">
      <div style="text-align:center;color:rgba(255,255,255,0.35);font-size:0.7rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;">Calculating fate...</div>
      <div class="names-display" id="namesDisplay"></div>
      <div class="loading-bar active"><div class="loading-fill"></div></div>
      <div class="flames-display" id="flamesDisplay">
        <div class="flame-letter" id="fl-F">F</div>
        <div class="flame-letter" id="fl-L">L</div>
        <div class="flame-letter" id="fl-A">A</div>
        <div class="flame-letter" id="fl-M">M</div>
        <div class="flame-letter" id="fl-E">E</div>
        <div class="flame-letter" id="fl-S">S</div>
      </div>
      <div class="counter-display" id="counterDisplay">—</div>
    </div>

    <!-- Result phase -->
    <div id="resultPhase" class="result-container">
      <span class="result-emoji" id="resultEmoji">💫</span>
      <div class="result-word" id="resultWord">LOVER</div>
      <div class="result-message" id="resultMessage"></div>
      <div>
        <button class="btn-again" onclick="resetGame()">↺ Try Again</button>
        <button class="btn-share" onclick="shareResult()">⬆ Share</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Plays</div></div>
    <div class="stat-item"><div class="stat-num" id="statToday">0</div><div class="stat-label">Today</div></div>
    <div class="stat-item"><div class="stat-num" id="statTop">—</div><div class="stat-label">Top Result</div></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInAnonymously, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"

// ── Firebase config ──
const firebaseConfig = {
  apiKey: "AIzaSyAGzsbo5HZA9NYimJ3pKPvlYJhYixJM9-E",
  authDomain: "flames2-95d6c.firebaseapp.com",
  projectId: "flames2-95d6c",
  storageBucket: "flames2-95d6c.firebasestorage.app",
  messagingSenderId: "691665272801",
  appId: "1:691665272801:web:5049cf48610d170f6a9ca0"
}

const app  = initializeApp(firebaseConfig)
const auth = getAuth(app)
const db   = getFirestore(app)

// ── Expose to window ──
window._auth = auth
window._db   = db

// ── Auth state ──
onAuthStateChanged(auth, user => {
  if(user) {
    showGamePage(user)
  } else {
    showAuthPage()
  }
})

// ── Login ──
window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim()
  const pass  = document.getElementById('loginPass').value
  if(!email||!pass) return showError('Fill in all fields!')
  setBtnLoading('btnLogin', true)
  try {
    await signInWithEmailAndPassword(auth, email, pass)
  } catch(e) {
    showError(friendlyError(e.code))
  }
  setBtnLoading('btnLogin', false)
}

// ── Register ──
window.doRegister = async () => {
  const email = document.getElementById('regEmail').value.trim()
  const pass  = document.getElementById('regPass').value
  if(!email||!pass) return showError('Fill in all fields!')
  if(pass.length < 6) return showError('Password must be 6+ characters!')
  setBtnLoading('btnReg', true)
  try {
    await createUserWithEmailAndPassword(auth, email, pass)
  } catch(e) {
    showError(friendlyError(e.code))
  }
  setBtnLoading('btnReg', false)
}

// ── Guest ──
window.doGuest = async () => {
  try { await signInAnonymously(auth) } catch(e) { showError('Guest login failed!') }
}

// ── Logout ──
window.doLogout = async () => {
  await signOut(auth)
}

// ── Save result to Firestore ──
window.saveResult = async (result, n1, n2) => {
  try {
    const user = auth.currentUser
    if(!user) return
    const ref = doc(db, 'users', user.uid)
    const snap = await getDoc(ref)
    const results = snap.exists() ? (snap.data().results || {}) : {}
    results[result] = (results[result]||0) + 1
    await setDoc(ref, {
      email: user.email || 'anonymous',
      totalPlays: increment(1),
      results,
      lastPlayed: serverTimestamp(),
      lastNames: `${n1} + ${n2}`,
    }, { merge: true })
  } catch(e) { console.log('Save failed', e) }
}

function showGamePage(user) {

  document.getElementById('gamePage').classList.add('active')

  const email = user.email || 'Guest'

function showAuthPage() {

function showError(msg) {
  const el = document.getElementById('authError')
  el.textContent = msg
  el.classList.add('show')

}

function setBtnLoading(id, loading) {
  const btn = document.getElementById(id)
  btn.disabled = loading
  btn.textContent = loading ? 'Loading...' : (id==='btnLogin' ? 'SIGN IN →' : 'CREATE ACCOUNT →')
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found':      'No account found with this email!',
    'auth/wrong-password':      'Wrong password!',
    'auth/email-already-in-use':'Email already registered!',
    'auth/invalid-email':       'Invalid email address!',
    'auth/weak-password':       'Password too weak!',
    'auth/too-many-requests':   'Too many attempts. Try later!',
    'auth/invalid-credential':  'Wrong email or password!',
  }
  return map[code] || 'Something went wrong!'
}
</script>

<script>

  pc.appendChild(p)

// ── Suggestions ──
const suggestions = ["Try with your crush 👀","Best friend or something more? 🤔","The stars don't lie... ✨","Dare to know the truth? 💀","Your fate is already written 🔮","Warning: results may cause feelings 😳"]
let si = 0

// ── Auth form toggle ──
window.showRegister = () => {

window.showLogin = () => {

// ── Stats ──
function getStats(){ return JSON.parse(localStorage.getItem('flames_stats')||'{"total":0,"today":0,"todayDate":"","results":{}}') }
function saveStats(s){ localStorage.setItem('flames_stats',JSON.stringify(s)) }
function updateStats(result){
  const s=getStats(), today=new Date().toDateString()
  s.total++
  if(s.todayDate!==today){s.today=0;s.todayDate=today}
  s.today++
  s.results[result]=(s.results[result]||0)+1
  saveStats(s); renderStats(s)
}
function renderStats(s){
  s=s||getStats()
  document.getElementById('statTotal').textContent=s.total
  document.getElementById('statToday').textContent=s.today
  let top='—',topVal=0
  for(const[k,v] of Object.entries(s.results||{})){if(v>topVal){topVal=v;top=k[0]}}
  document.getElementById('statTop').textContent=top
}
renderStats()

// ── FLAMES Algorithm ──
function flamesAlgo(n1,n2){
  let a=n1.toLowerCase().replace(/\s/g,'').split('')
  let b=n2.toLowerCase().replace(/\s/g,'').split('')
  for(let i=0;i<a.length;i++){const j=b.indexOf(a[i]);if(j!==-1){a[i]=null;b[j]=null}}
  const count=a.filter(x=>x).length+b.filter(x=>x).length
  const flames=['F','L','A','M','E','S']
  let idx=0
  while(flames.length>1){idx=(idx+count-1)%flames.length;flames.splice(idx,1);if(idx>=flames.length)idx=0}
  return{result:flames[0],count}
}

// ── Result data ──
const resultData={
  F:{word:'FRIEND',   emoji:'🤝',msg:"Best friends forever! But are you sure? 👀",cls:'FRIEND'},
  L:{word:'LOVER',    emoji:'💘',msg:"Bro… this is dangerous 😏",cls:'LOVER'},
  A:{word:'AFFECTION',emoji:'🥺',msg:"There's something there... don't ignore it 💛",cls:'AFFECTION'},
  M:{word:'MARRIAGE', emoji:'💍',msg:"Someone's getting a ring soon 👀🔥",cls:'MARRIAGE'},
  E:{word:'ENEMY',    emoji:'💀',msg:"Avoid eye contact. Run. 💀",cls:'ENEMY'},
  S:{word:'SOULMATES',emoji:'✨',msg:"Written in the stars. This is fate 🌌",cls:'SOULMATES'},
}

let currentResult=null, n1Val='', n2Val=''

window.startFlames = () => {
  n1Val=document.getElementById('name1').value.trim()
  n2Val=document.getElementById('name2').value.trim()
  if(!n1Val||!n2Val){
    document.querySelectorAll('#inputPhase .input-field').forEach(f=>{
      if(!f.value.trim()){f.style.borderColor='#ff2d78';setTimeout(()=>f.style.borderColor='',600)}
    }); return
  }
  const{result,count}=flamesAlgo(n1Val,n2Val)
  currentResult=result
  document.getElementById('inputPhase').style.display='none'
  document.getElementById('animPhase').style.display='block'
  document.getElementById('resultPhase').classList.remove('show')
  'FLAMES'.split('').forEach(l=>{document.getElementById('fl-'+l).className='flame-letter'})
  showLetterAnim(n1Val,n2Val,count,result)
}

function showLetterAnim(n1,n2,count,result){
  const nd=document.getElementById('namesDisplay'); nd.innerHTML=''
  let a=n1.toLowerCase().replace(/\s/g,'').split('')
  let b=n2.toLowerCase().replace(/\s/g,'').split('')
  const ta=[...a],tb=[...b]
  const cancelled1=[]
  for(let i=0;i<ta.length;i++){const j=tb.indexOf(ta[i]);if(j!==-1){cancelled1.push(i);tb[j]=null;ta[i]=null}}
  a.forEach((l,i)=>{const s=document.createElement('span');s.className='name-letter';s.textContent=l;s.id='nl1-'+i;nd.appendChild(s)})
  const sep=document.createElement('span');sep.className='name-sep';sep.textContent='+';nd.appendChild(sep)
  b.forEach((l,i)=>{const s=document.createElement('span');s.className='name-letter';s.textContent=l;s.id='nl2-'+i;nd.appendChild(s)})
  let delay=200
  cancelled1.forEach((i,idx)=>{
    setTimeout(()=>{
      document.getElementById('nl1-'+i)?.classList.add('cancelled')
      const bIdx=[...b].findIndex((l,bi)=>l===a[i]&&!document.getElementById('nl2-'+bi)?.classList.contains('cancelled'))
      if(bIdx!==-1)document.getElementById('nl2-'+bIdx)?.classList.add('cancelled')
    },delay+idx*150); delay+=150
  })
  setTimeout(()=>startFlamesCycling(count,result),delay+500)
}

function startFlamesCycling(count,result){
  const flames=['F','L','A','M','E','S']
  let active=[...flames],idx=0
  const counterEl=document.getElementById('counterDisplay')
  function cycle(){
    if(active.length<=1){
      const winner=active[0]
      document.getElementById('fl-'+winner).className='flame-letter winner'
      counterEl.textContent='★'
      setTimeout(()=>showResult(winner),800); return
    }
    for(let c=0;c<count;c++){
      idx=idx%active.length
      flames.forEach(l=>{const el=document.getElementById('fl-'+l);if(el&&!el.classList.contains('eliminated'))el.classList.remove('active')})
      if(c===count-1){const el=document.getElementById('fl-'+active[idx]);if(el)el.classList.add('active')}
      idx++
    }
    idx--
    const eliminated=active[idx%active.length]
    const elimEl=document.getElementById('fl-'+eliminated)
    if(elimEl){elimEl.classList.remove('active');elimEl.classList.add('eliminated')}
    active.splice(idx%active.length,1)
    if(idx>=active.length)idx=0
    counterEl.textContent=active.join(' ')
    setTimeout(cycle,active.length>3?400:active.length>2?500:700)
  }
  counterEl.textContent=count+' letters'
  setTimeout(cycle,600)
}

function showResult(letter){
  const data=resultData[letter]||resultData['F']
  document.getElementById('animPhase').style.display='none'
  document.getElementById('resultPhase').classList.add('show')
  document.getElementById('resultEmoji').textContent=data.emoji
  const rw=document.getElementById('resultWord')
  rw.textContent=data.word; rw.className='result-word '+data.cls
  document.getElementById('resultMessage').textContent=data.msg
  updateStats(data.word)
  if(window.saveResult) window.saveResult(data.word, n1Val, n2Val)
  if(navigator.vibrate) navigator.vibrate([100,50,200])
}

window.resetGame = () => {

window.shareResult = () => {

  navigator.clipboard.writeText(text).then(()=>{

  })
}
